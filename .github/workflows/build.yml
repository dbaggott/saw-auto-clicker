name: Build

# The release build of both binaries for each Windows target. On main, the
# release workflow publishes these same artifacts, so what CI built is what
# ships.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: saw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/saw-app.exe
            target/${{ matrix.target }}/release/saw-measure.exe
          if-no-files-found: error
