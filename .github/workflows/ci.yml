name: CI

# Tests and builds the app, and builds the download page in site/. A push to
# main also releases the app when its workspace version has no release yet,
# so bumping the version in Cargo.toml is how a release is cut.
#
# Outside pull requests, the site build is published to the operations release
# bucket as saw-auto-clicker-site/<sanitized-branch>_<sha>. PUBLISHING IS NOT
# DEPLOYING: nothing a visitor sees changes until `apps/app deploy
# saw-auto-clicker-site <branch>` in dbaggott/infrastructure copies the release
# into the site. AWS_ROLE_ARN, AWS_REGION and RELEASES_BUCKET are repo
# variables set from there (accounts/github/saw_auto_clicker_ci.tf).
#
# No `branches:` filter on pull_request: stacked PRs target feature branches,
# and they need CI as much as PRs into main do.
on:
  pull_request:
  push:
    branches: [main]
  # Publishes a branch's site build, for `apps/app deploy saw-auto-clicker-site
  # <branch>`. Dispatchable once this file is on the default branch; a
  # dispatched run uses the chosen branch's copy, publish job included, so
  # anyone who can push a branch decides what runs with the publish role.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight for it. Every other run gets
# a group of its own commit, since each may publish a site build or a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # The core is developed on macOS, so the workspace has to stay lint-clean
  # there and the core's tests have to keep passing without Windows.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p saw-core --locked

  build:
    uses: ./.github/workflows/build.yml

  # Installs and uninstalls the x64 installer CI just built, the bytes a
  # release would publish. Gates the release as well as merges, so a broken
  # installer never ships.
  installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saw-x86_64-pc-windows-msvc
          path: built
      - uses: actions/download-artifact@v8
        with:
          name: saw-aarch64-pc-windows-msvc
          path: built/arm64
      - run: ./.github/scripts/check-installer.ps1 -Built built

  # Third-party actions on the site's path to the publish role are pinned to
  # commit SHAs: this repo is public, and a moved tag would run someone else's
  # code with what that role can write.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.tool-versions
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Check the build
        run: npm test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: site/dist
          retention-days: 1

  # The only job that can reach AWS. The publish role trusts the `publish`
  # environment and nothing else in this repo, and this job must keep running
  # only on push and workflow_dispatch, never on anything a fork can trigger.
  publish-site:
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish
        env:
          RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The tag apps/app resolves a branch to, sanitized the same way.
          TAG="$(printf '%s' "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')_${SHA}"
          DEST="s3://${RELEASES_BUCKET}/saw-auto-clicker-site/${TAG}"

          # Nothing in the build is content-hashed, so every file revalidates.
          aws s3 cp site "${DEST}" --recursive --only-show-errors \
            --cache-control "no-cache"

          # Last, because a deploy treats its presence as the release being
          # complete, and the live site serving it as the deploy having landed.
          jq -n --arg release "$TAG" --arg commit "$SHA" '{release: $release, commit: $commit}' > release.json
          aws s3 cp release.json "${DEST}/release.json" --only-show-errors \
            --content-type application/json --cache-control "no-cache"

          echo "Published ${DEST}/"

  # Decides whether this push to main releases: it does when no release
  # exists yet for the workspace version.
  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      unreleased: ${{ steps.check.outputs.unreleased }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          else
            echo "$tag has no release yet; releasing this commit"
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [release-check, test, macos, build, installer]
    if: needs.release-check.outputs.unreleased == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-check.outputs.tag }}

  # The one check branch protection is meant to require, so a job gates merges
  # by being listed in `needs:`. `if: always()` keeps a failed dependency from
  # skipping this job, which branch protection would read as passing. A skipped
  # dependency counts as passing, so a job that gains an `if:` stops gating;
  # that is how publish-site passes on a pull request. The release jobs run
  # only after a merge, so they are left out.
  ci-required:
    if: always()
    needs: [test, macos, build, installer, site, publish-site]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs.*.result = $RESULTS"
          for r in ${RESULTS//,/ }; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency reported '$r'"; exit 1 ;;
            esac
          done
