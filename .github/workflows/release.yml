name: Release

# Called by CI on a push to main whose workspace version has no release yet.
# Checks that the x64 app CI built for that commit launches, then publishes a
# GitHub release tagged v<version> at the commit, with the installer attached
# and the version's CHANGELOG.md section as its notes; CI's installer job has
# already installed and uninstalled it on x64 and Arm64. A version with a
# hyphen, such as 0.2.0-rc.1, is a pre-release.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, v<workspace version>.
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Runs the exact x64 app the release's installer carries. Bash, because it waits
  # for any child and reports its exit code; PowerShell skips the wait for a
  # GUI-subsystem program unless its output is piped.
  smoke-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: saw-x86_64-pc-windows-msvc
      # The runner's bash runs with -e, so each exit code is read with `||`.
      - name: saw-app --version exits 0 and reports the version
        run: |
          status=0
          out=$(./saw-app.exe --version) || status=$?
          echo "exit code $status, stdout: $out"
          test "$status" -eq 0
          test "$out" = "saw-app ${TAG#v}"

  release:
    needs: smoke-x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Pinned to commits: this job can write releases on a public repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saw-installer
          path: built
      - name: Name the asset
        run: |
          set -euo pipefail
          mkdir assets
          cp built/saw-auto-clicker-installer.exe "assets/saw-auto-clicker-$TAG-installer.exe"
          ls -l assets
      - name: Publish the release
        run: |
          set -euo pipefail
          # Two pushes to main in quick succession can both find the version
          # unreleased. The tag belongs to whichever published first; a re-run
          # of that same commit finishes a partial upload.
          if gh release view "$TAG" >/dev/null 2>&1; then
            tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [[ $tagged != "$SHA" ]]; then
              echo "::notice::$TAG is already released from $tagged; nothing to publish for $SHA"
              exit 0
            fi
            gh release upload "$TAG" assets/* --clobber
            exit 0
          fi
          # gh release create ignores --target when the tag already exists, so
          # a stray tag elsewhere would carry binaries built from another commit.
          if tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null) && [[ $tagged != "$SHA" ]]; then
            echo "::error::tag $TAG already points at $tagged, not $SHA; delete it or bump the version"
            exit 1
          fi
          .github/scripts/release-notes.sh "$TAG" "$GH_REPO" > notes.md
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" assets/* --target "$SHA" --title "$TAG" \
            --notes-file notes.md "${prerelease[@]}"
