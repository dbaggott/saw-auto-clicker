name: Release

# Called by CI on a push to main whose workspace version has no release yet.
# Publishes a GitHub release tagged v<version> at the commit, with the
# installer CI built attached and the version's CHANGELOG.md section as its
# notes. CI's installer job has already installed it on x64 and Arm64 and
# checked the installed app reports the version. A version with a hyphen, such
# as 0.2.0-rc.1, is a pre-release.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, v<workspace version>.
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Pinned to commits: this job can write releases on a public repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saw-installer
          path: built
      - name: Name the asset
        run: |
          set -euo pipefail
          mkdir assets
          cp built/saw-auto-clicker-installer.exe "assets/saw-auto-clicker-$TAG-installer.exe"
          ls -l assets
      - name: Publish the release
        run: |
          set -euo pipefail
          # Two pushes to main in quick succession can both find the version
          # unreleased. The tag belongs to whichever published first; a re-run
          # of that same commit finishes a partial upload.
          if gh release view "$TAG" >/dev/null 2>&1; then
            tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [[ $tagged != "$SHA" ]]; then
              echo "::notice::$TAG is already released from $tagged; nothing to publish for $SHA"
              exit 0
            fi
            gh release upload "$TAG" assets/* --clobber
            exit 0
          fi
          # gh release create ignores --target when the tag already exists, so
          # a stray tag elsewhere would carry binaries built from another commit.
          if tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null) && [[ $tagged != "$SHA" ]]; then
            echo "::error::tag $TAG already points at $tagged, not $SHA; delete it or bump the version"
            exit 1
          fi
          .github/scripts/release-notes.sh "$TAG" "$GH_REPO" > notes.md
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" assets/* --target "$SHA" --title "$TAG" \
            --notes-file notes.md "${prerelease[@]}"
