name: Release

# Called by CI on a push to main whose workspace version has no release yet.
# Checks that the x64 binaries CI built for that commit launch, then publishes
# a GitHub release tagged v<version> at the commit, with both binaries and the
# installer for x64 and arm64 attached; CI's installer job has already
# installed and uninstalled the x64 installer. A version with a hyphen, such
# as 0.2.0-rc.1, is a pre-release.
on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, v<workspace version>.
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Runs the exact bytes the release will carry. Bash, because it waits for
  # any child and reports its exit code; PowerShell skips the wait for a
  # GUI-subsystem program unless its output is piped.
  smoke-x64:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: saw-x86_64-pc-windows-msvc
      # The runner's bash runs with -e, so each exit code is read with `||`.
      - name: saw-app --version exits 0 and reports the version
        run: |
          status=0
          out=$(./saw-app.exe --version) || status=$?
          echo "exit code $status, stdout: $out"
          test "$status" -eq 0
          test "$out" = "saw-app ${TAG#v}"
      - name: saw-measure starts and prints its usage
        run: |
          # With no command it refuses with its usage, which it prints only
          # once it has started.
          status=0
          err=$(./saw-measure.exe 2>&1 >/dev/null) || status=$?
          echo "exit code $status"
          echo "$err"
          test "$status" -eq 1
          grep -q 'saw-measure run --cps' <<<"$err"

  release:
    needs: smoke-x64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Pinned to a commit: this job can write releases on a public repo.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: saw-*
          path: built
      - name: Name the assets
        run: |
          set -euo pipefail
          mkdir assets
          for pair in x86_64-pc-windows-msvc:x64 aarch64-pc-windows-msvc:arm64; do
            target=${pair%%:*} arch=${pair##*:}
            cp "built/saw-$target/saw-app.exe" "assets/saw-auto-clicker-$TAG-$arch.exe"
            cp "built/saw-$target/saw-measure.exe" "assets/saw-measure-$TAG-$arch.exe"
            cp "built/saw-$target/saw-auto-clicker-setup.exe" "assets/saw-auto-clicker-$TAG-$arch-setup.exe"
          done
          ls -l assets
      - name: Publish the release
        run: |
          set -euo pipefail
          # Two pushes to main in quick succession can both find the version
          # unreleased. The tag belongs to whichever published first; a re-run
          # of that same commit finishes a partial upload.
          if gh release view "$TAG" >/dev/null 2>&1; then
            tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [[ $tagged != "$SHA" ]]; then
              echo "::notice::$TAG is already released from $tagged; nothing to publish for $SHA"
              exit 0
            fi
            gh release upload "$TAG" assets/* --clobber
            exit 0
          fi
          # gh release create ignores --target when the tag already exists, so
          # a stray tag elsewhere would carry binaries built from another commit.
          if tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null) && [[ $tagged != "$SHA" ]]; then
            echo "::error::tag $TAG already points at $tagged, not $SHA; delete it or bump the version"
            exit 1
          fi
          cat > notes.md <<NOTES
          Which file to download, how to install or run it, and the SmartScreen prompt these unsigned builds show: see the [README](https://github.com/$GH_REPO/blob/$TAG/README.md#download-and-install).

          \`saw-auto-clicker-$TAG-x64-setup.exe\` and \`saw-auto-clicker-$TAG-arm64-setup.exe\` install the app for your user, with a Start menu entry and an uninstaller. \`saw-auto-clicker-$TAG-x64.exe\` and \`saw-auto-clicker-$TAG-arm64.exe\` are the same app, to run without installing.

          \`saw-measure-$TAG-x64.exe\` and \`saw-measure-$TAG-arm64.exe\` are a developer timing tool, not part of the app.
          NOTES
          prerelease=()
          [[ $TAG == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" assets/* --target "$SHA" --title "$TAG" \
            --notes-file notes.md "${prerelease[@]}"
