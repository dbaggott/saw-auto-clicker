[package]
name = "saw-app"
description = "The saw-auto-clicker tray app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
saw-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[target.'cfg(windows)'.dependencies]
saw-windows.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
tray-icon = "0.26.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
ico = "0.6.0"
